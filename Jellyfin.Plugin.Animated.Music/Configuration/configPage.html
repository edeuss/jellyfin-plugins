<div id="AnimatedMusicConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <form id="AnimatedMusicConfigForm">
                <div class="sectionTitleContainer flex align-items-center">
                    <h2 class="sectionTitle">Animated Music</h2>
                </div>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input id="EnableWebUi" is="emby-checkbox" type="checkbox" />
                        <span>Show animated covers in Jellyfin Web</span>
                    </label>
                    <div class="fieldDescription">
                        Library cards play on hover. Album page and now playing play muted.
                    </div>
                </div>
                <div class="inputContainer">
                    <p id="InjectionStatus" class="fieldDescription"></p>
                </div>
                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block">
                        <span>Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script>
        (function () {
            var pluginId = 'd5861930-8da6-499c-b7dd-235c60703f64';
            var page = document.querySelector('#AnimatedMusicConfigPage');

            function statusText(code) {
                switch (code) {
                    case 'FileTransformation':
                        return 'Loaded with File Transformation.';
                    case 'JavaScriptInjector':
                        return 'Loaded with JavaScript Injector.';
                    case 'IndexHtml':
                        return 'Script tag added to jellyfin-web/index.html.';
                    case 'Manual':
                        return 'Could not inject automatically. Add src="../AnimatedMusic/web.js" before </body> in jellyfin-web/index.html.';
                    case 'Disabled':
                        return 'Web UI is off.';
                    default:
                        return 'Status: ' + (code || 'unknown') + '. Restart Jellyfin after saving if nothing shows up.';
                }
            }

            page.addEventListener('viewshow', function () {
                Dashboard.showLoadingMsg();
                Promise.all([
                    ApiClient.getPluginConfiguration(pluginId),
                    ApiClient.ajax({ url: ApiClient.getUrl('AnimatedMusic'), type: 'GET', dataType: 'json' })
                ]).then(function (results) {
                    var config = results[0];
                    var status = results[1];
                    page.querySelector('#EnableWebUi').checked = config.EnableWebUi !== false;
                    page.querySelector('#InjectionStatus').textContent = statusText(status.injectionStatus);
                    Dashboard.hideLoadingMsg();
                }).catch(function () {
                    Dashboard.hideLoadingMsg();
                });
            });

            page.querySelector('#AnimatedMusicConfigForm').addEventListener('submit', function (e) {
                e.preventDefault();
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                    config.EnableWebUi = page.querySelector('#EnableWebUi').checked;
                    return ApiClient.updatePluginConfiguration(pluginId, config);
                }).then(function (result) {
                    Dashboard.processPluginConfigurationUpdateResult(result);
                }).catch(function () {
                    Dashboard.hideLoadingMsg();
                });
            });
        })();
    </script>
</div>
