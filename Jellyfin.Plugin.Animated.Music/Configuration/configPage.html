<div id="AnimatedMusicConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-checkbox" data-controller="__plugin/animatedMusicConfig.js">
    <div data-role="content">
        <div class="content-primary">
            <form id="AnimatedMusicConfigForm" onsubmit="return false;">
                <div class="sectionTitleContainer flex align-items-center">
                    <h2 class="sectionTitle">Animated Music</h2>
                </div>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input id="EnableWebUi" is="emby-checkbox" type="checkbox" />
                        <span>Show animated covers in Jellyfin Web</span>
                    </label>
                    <div class="fieldDescription">
                        Library cards play on hover. Album page and now playing play muted.
                    </div>
                </div>
                <div class="inputContainer">
                    <p id="InjectionStatus" class="fieldDescription"></p>
                </div>
                <div>
                    <button is="emby-button" type="button" id="saveConfig" class="raised button-submit block">
                        <span>Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
